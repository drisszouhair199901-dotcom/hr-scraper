name: HR Scraper Bot

on:
  workflow_dispatch:
    inputs:
      job_title:
        description: 'نوع التكوين أو المهنة (مثلاً: Pflegefachmann)'
        required: true
        default: 'pflegefachmann'
        type: string
      location:
        description: 'المدينة أو الولاية (مثلاً: stuttgart أو schreiben Sie "alle" للكل)'
        required: true
        default: 'stuttgart'
        type: string
      start_year:
        description: 'سنة البدء (مثلاً: 2027)'
        required: true
        default: '2027'
        type: string

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install library
        run: pip install requests

      - name: Run Scraper
        env:
          JOB_TITLE: ${{ github.event.inputs.job_title }}
          LOCATION: ${{ github.event.inputs.location }}
          START_YEAR: ${{ github.event.inputs.start_year }}
        run: python scraper.py

      - name: Save CSV results
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          git add hr_emails.csv
          git commit -m "Auto-update HR emails with custom inputs" || exit 0
          git push
